    <title>books.metta.family — Đọc để hiểu, hiểu để thương</title>
    <script>
      // Set the theme before first paint so a dark-theme reader never sees a
      // white flash. LayoutSettingsContext keeps it in sync afterwards.
      try {
        var t = (JSON.parse(localStorage.getItem('bt_layout_settings') || '{}').theme) || 'system';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
